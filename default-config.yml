version: 1

workspace:
  default: active
  create_worktree_only_when_requested: true

defaults:
  profile: auto
  agent: agy
  timeout_ms: 3600000
  max_retries: 2

artifacts:
  root: .pipeline

policies:
  require_plan_before_implementation: true
  require_plan_approval: true
  require_review_before_success: true
  require_tests_before_merge: true
  max_fix_loops: 3
  max_stage_retries: 2
  max_pipeline_retries: 1

profiles:
  auto: profiles/auto.yml
  ecc: profiles/ecc.yml
  patch: profiles/patch.yml
  investigate: profiles/investigate.yml

# External Knowledge Adapter for ECC (Optional read-only folder, fallback to built-in if omitted)
ecc:
  path: "" # Optional path to an external git clone of affaan-m/ecc (e.g. /path/to/ecc or via ECC_DIR env)
  auto_sync: false
