name: secure
description: Secure workflow with parallel architect, security, and pattern specialists

stages:
  - id: plan
    role: planner
    agent: auto
    worktree: active
    mode: analysis
    read_only: true
    require_approval: true
    ecc_skills:
      - search-first
      - iterative-retrieval
    outputs:
      - plan.md
    next:
      - architecture
      - security
      - pattern

  - id: architecture
    role: architect
    agent: auto
    worktree: active
    read_only: true
    ecc_skills:
      - backend-patterns
      - api-design
    inputs:
      - plan.md
    outputs:
      - architecture.md
    deps:
      - plan
    next:
      - implement

  - id: security
    role: security
    agent: auto
    worktree: active
    read_only: true
    ecc_skills:
      - security-review
    inputs:
      - plan.md
    outputs:
      - security-plan.md
    deps:
      - plan
    next:
      - implement

  - id: pattern
    role: design-pattern
    agent: auto
    worktree: active
    read_only: true
    ecc_skills:
      - backend-patterns
    inputs:
      - plan.md
    outputs:
      - pattern.md
    deps:
      - plan
    next:
      - implement

  - id: implement
    role: coder
    agent: auto
    worktree: active
    mode: goal
    ecc_skills:
      - coding-standards
    inputs:
      - plan.md
      - architecture.md
      - security-plan.md
      - pattern.md
    outputs:
      - implementation.md
    deps:
      - architecture
      - security
      - pattern
    next:
      - test

  - id: test
    role: tester
    agent: auto
    worktree: active
    mode: verify
    ecc_skills:
      - verification-loop
    inputs:
      - plan.md
      - implementation.md
    outputs:
      - test.md
    next:
      - review

  - id: review
    role: reviewer
    agent: auto
    worktree: active
    mode: review
    ecc_skills:
      - coding-standards
    inputs:
      - plan.md
      - implementation.md
      - test.md
    outputs:
      - review.md
    on:
      pass: final-security
      fail: fix

  - id: final-security
    role: security-review
    agent: auto
    worktree: active
    read_only: true
    ecc_skills:
      - security-review
    inputs:
      - plan.md
      - security-plan.md
      - implementation.md
      - review.md
    outputs:
      - security-review.md
    deps:
      - review
    on:
      pass: completed
      fail: fix
