name: standard
description: Standard workflow (plan -> implement -> test -> review with fix loop)

stages:
  - id: plan
    role: planner
    agent: auto
    ecc_agent: planner
    worktree: active
    mode: analysis
    read_only: true
    require_approval: true
    ecc_skills:
      - search-first
      - iterative-retrieval
    outputs:
      - plan.md
    next:
      - implement

  - id: implement
    role: coder
    agent: auto
    worktree: active
    mode: goal
    ecc_skills:
      - coding-standards
    ecc_rules:
      - common
    inputs:
      - plan.md
    outputs:
      - implementation.md
    next:
      - test

  - id: test
    role: tester
    agent: auto
    ecc_agent: tdd-guide
    worktree: active
    mode: verify
    ecc_skills:
      - verification-loop
      - tdd-workflow
    ecc_rules:
      - common
    inputs:
      - plan.md
      - implementation.md
    outputs:
      - test.md
    next:
      - review

  - id: review
    role: reviewer
    agent: auto
    ecc_agent: code-reviewer
    worktree: active
    mode: review
    ecc_skills:
      - coding-standards
    ecc_rules:
      - common
    ecc_workflows:
      - orch-review
    inputs:
      - plan.md
      - implementation.md
      - test.md
    outputs:
      - review.md
    on:
      pass: completed
      fail: fix
