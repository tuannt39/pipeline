name: ecc
description: Single-session full engineering pipeline with ECC methodology and mandatory user plan approval gate

stages:
  - id: requirement
    role: analyst
    read_only: true
    ecc_skills:
      - search-first
      - iterative-retrieval
    outputs:
      - requirement.md
      - business-rules.md
    next:
      - acceptance

  - id: acceptance
    role: analyst
    read_only: true
    ecc_skills:
      - search-first
    inputs:
      - requirement.md
    outputs:
      - acceptance.md
    deps:
      - requirement
    next:
      - impact-analysis

  - id: impact-analysis
    role: analyst
    read_only: true
    ecc_skills:
      - search-first
      - iterative-retrieval
    inputs:
      - requirement.md
      - acceptance.md
    outputs:
      - impact-analysis.md
    deps:
      - acceptance
    next:
      - blueprint

  - id: blueprint
    role: architect
    read_only: true
    ecc_skills:
      - search-first
      - iterative-retrieval
    inputs:
      - requirement.md
      - acceptance.md
      - impact-analysis.md
    outputs:
      - blueprint.md
    deps:
      - impact-analysis
    next:
      - architecture

  - id: architecture
    role: architect
    read_only: true
    ecc_skills:
      - backend-patterns
      - api-design
    inputs:
      - blueprint.md
    outputs:
      - architecture.md
    deps:
      - blueprint
    next:
      - design-patterns

  - id: design-patterns
    role: architect
    read_only: true
    ecc_skills:
      - backend-patterns
    inputs:
      - architecture.md
      - blueprint.md
    outputs:
      - design-patterns.md
    deps:
      - architecture
    next:
      - adr

  - id: adr
    role: architect
    read_only: true
    ecc_skills:
      - backend-patterns
    inputs:
      - architecture.md
      - design-patterns.md
    outputs:
      - adr/ADR-001.md
    deps:
      - design-patterns
    next:
      - architecture-review

  - id: architecture-review
    role: reviewer
    read_only: true
    ecc_skills:
      - search-first
    inputs:
      - architecture.md
      - design-patterns.md
      - adr/ADR-001.md
    outputs:
      - architecture-review.md
    deps:
      - adr
    next:
      - plan

  - id: plan
    role: planner
    read_only: true
    require_approval: true
    ecc_skills:
      - search-first
      - iterative-retrieval
    inputs:
      - requirement.md
      - acceptance.md
      - architecture.md
      - design-patterns.md
      - architecture-review.md
    outputs:
      - plan.md
      - test-plan.md
    deps:
      - architecture-review
    next:
      - acceptance-tests

  - id: acceptance-tests
    role: tester
    read_only: true
    ecc_skills:
      - tdd-workflow
    inputs:
      - acceptance.md
      - plan.md
    outputs:
      - acceptance-tests.md
    deps:
      - plan
    next:
      - tdd

  - id: tdd
    role: developer
    ecc_skills:
      - tdd-workflow
    inputs:
      - plan.md
      - acceptance-tests.md
    outputs:
      - tdd.md
    deps:
      - acceptance-tests
    next:
      - implement

  - id: implement
    role: coder
    ecc_skills:
      - coding-standards
    inputs:
      - plan.md
      - tdd.md
      - architecture.md
    outputs:
      - implementation.md
    deps:
      - tdd
    next:
      - code-review

  - id: code-review
    role: reviewer
    read_only: true
    ecc_skills:
      - coding-standards
    inputs:
      - plan.md
      - implementation.md
    outputs:
      - code-review.md
    deps:
      - implement
    next:
      - security-review

  - id: security-review
    role: security-review
    read_only: true
    ecc_skills:
      - security-review
    inputs:
      - implementation.md
    outputs:
      - security-review.md
    deps:
      - code-review
    next:
      - design-conformance

  - id: design-conformance
    role: reviewer
    read_only: true
    ecc_skills:
      - backend-patterns
    inputs:
      - architecture.md
      - design-patterns.md
      - implementation.md
    outputs:
      - design-conformance.md
    deps:
      - security-review
    next:
      - remediation

  - id: remediation
    role: coder
    ecc_skills:
      - coding-standards
    inputs:
      - code-review.md
      - security-review.md
      - design-conformance.md
    outputs:
      - remediation.md
    deps:
      - design-conformance
    next:
      - test

  - id: test
    role: tester
    ecc_skills:
      - verification-loop
      - tdd-workflow
    inputs:
      - implementation.md
      - plan.md
    outputs:
      - test.md
    deps:
      - remediation
    next:
      - verification

  - id: verification
    role: verifier
    ecc_skills:
      - verification-loop
    inputs:
      - implementation.md
      - test.md
    outputs:
      - verification.md
    deps:
      - test
    next:
      - audit

  - id: audit
    role: reviewer
    read_only: true
    ecc_skills:
      - verification-loop
    inputs:
      - requirement.md
      - architecture.md
      - implementation.md
      - verification.md
    outputs:
      - audit.md
    deps:
      - verification
    next:
      - evidence

  - id: evidence
    role: reviewer
    read_only: true
    ecc_skills:
      - verification-loop
    inputs:
      - audit.md
      - verification.md
    outputs:
      - evidence.json
      - result.md
    deps:
      - audit
