name: simple
description: Fast path with lightweight plan (plan -> implement -> test -> review)

stages:
  - id: plan
    role: planner
    agent: auto
    worktree: active
    mode: analysis
    read_only: true
    require_approval: true
    ecc_skills:
      - search-first
      - iterative-retrieval
    outputs:
      - plan.md
    next:
      - implement

  - id: implement
    role: coder
    agent: auto
    worktree: active
    mode: goal
    ecc_skills:
      - coding-standards
    inputs:
      - plan.md
    outputs:
      - implementation.md
    deps:
      - plan
    next:
      - test

  - id: test
    role: tester
    agent: auto
    worktree: active
    mode: verify
    ecc_skills:
      - verification-loop
    inputs:
      - implementation.md
    outputs:
      - test.md
    next:
      - review

  - id: review
    role: reviewer
    agent: auto
    worktree: active
    mode: review
    ecc_skills:
      - coding-standards
    inputs:
      - implementation.md
      - test.md
    outputs:
      - review.md
    on:
      pass: completed
      fail: fix
